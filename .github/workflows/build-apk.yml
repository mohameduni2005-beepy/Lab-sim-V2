name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:        # lets you press "Run workflow" manually from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Capacitor (latest)
        run: |
          npm install @capacitor/core @capacitor/android
          npm install -D @capacitor/cli

      - name: Add Android project
        run: npx cap add android

      # Optional: lock the app to landscape (uncomment the next 2 lines)
      # - name: Lock landscape
      #   run: sed -i 's/<activity /<activity android:screenOrientation="sensorLandscape" /' android/app/src/main/AndroidManifest.xml

      - name: Sync web files
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: circuit-jumper-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
