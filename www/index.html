<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a1128">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
<title>Circuit Jumper</title>
</head>
<body>
<header id="hdr">
  <svg class="bolt" viewBox="0 0 48 56" aria-hidden="true"><polygon points="30,2 6,32 22,32 16,54 42,22 26,22" fill="#ffd60a"/></svg>
  <div class="ttl"><b>CIRCUIT JUMPER</b><small>Cambridge Technologies trainer panels</small></div>
  <svg class="wave" viewBox="0 0 120 30" preserveAspectRatio="none" aria-hidden="true"><path d="M0 15 Q 10 0 20 15 T 40 15 T 60 15 T 80 15 T 100 15 T 120 15" fill="none" stroke="#00e5ff" stroke-width="2"/></svg>
  <button id="btnFit" class="hb">ملائمة</button>
</header>

<div id="stage">
  <canvas id="c"></canvas>
  <div id="status"></div>

  <div id="sheets">
    <section class="sheet" id="sh-wire">
      <h3>الأسلاك (Jumpers)</h3>
      <div class="row"><span id="swatches"></span><input type="color" id="customColor" value="#ff0000" title="لون مخصص"></div>
      <label class="rng">السمك <input type="range" id="wWidth" min="2" max="18" value="6"></label>
      <label class="rng">الانحناء <input type="range" id="wCurve" min="0" max="100" value="35"></label>
      <button id="btnDelSel" class="btn">حذف السلك المحدد</button>
      <p class="hint">المس سلك لتحديده، فأي تغيير هنا يتطبق عليه. اضغط مطولاً على سلك لحذفه.</p>
    </section>

    <section class="sheet" id="sh-dev">
      <h3>الأجهزة</h3>
      <div class="row"><span>عدد الأجهزة جنب بعض:</span>
        <button id="colMinus" class="btn sm">−</button><b id="colVal">2</b><button id="colPlus" class="btn sm">+</button></div>
      <div id="devList"></div>
      <button id="btnAllDev" class="btn">إظهار الكل</button>
    </section>

    <section class="sheet" id="sh-sim">
      <h3>المحاكاة</h3>
      <label class="chk"><input type="checkbox" id="chkRun" checked> تشغيل المحاكاة</label>
      <label class="chk"><input type="checkbox" id="chkMain" checked> المفتاح الرئيسي MAIN ON</label>
      <label class="chk"><input type="checkbox" id="chkVar" checked> المتغير VARIABLE ON</label>
      <label class="rng">الفاريك <b id="pctVal">50%</b> <input type="range" id="pct" min="0" max="100" value="50"></label>
      <div class="row"><span>التردد Hz</span><select id="freq"><option>50</option><option>60</option></select></div>
      <label class="chk"><input type="checkbox" id="chkW1"> W1 عكس القطبية (MINUS)</label>
      <label class="chk"><input type="checkbox" id="chkW2"> W2 عكس القطبية (MINUS)</label>
      <pre id="readout" dir="ltr"></pre>
    </section>

    <section class="sheet" id="sh-file">
      <h3>ملف</h3>
      <div class="row"><input type="text" id="slotName" placeholder="اسم الدايرة"><button id="btnSave" class="btn">حفظ</button></div>
      <div id="slotList"></div>
      <div class="row"><button id="btnNets" class="btn">الوصلات</button><button id="btnClear" class="btn warn">مسح الكل</button></div>
      <pre id="netBox" dir="ltr"></pre>
      <div class="row"><button id="btnExport" class="btn">تصدير (نسخ)</button><button id="btnImport" class="btn">استيراد</button></div>
      <textarea id="jsonBox" dir="ltr" rows="3" placeholder="الصق نص الدايرة هنا للاستيراد"></textarea>
    </section>
  </div>
</div>

<nav id="bar">
  <button id="bUndo">↶ تراجع</button>
  <button data-sheet="wire">الأسلاك</button>
  <button data-sheet="dev">الأجهزة</button>
  <button data-sheet="sim">المحاكاة</button>
  <button data-sheet="file">ملف</button>
</nav>

<script src="js/data.js"></script>
<script src="js/sim.js"></script>
<script src="js/app.js"></script>
</body>
</html>
